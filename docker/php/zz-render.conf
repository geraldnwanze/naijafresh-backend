; Loaded after the image's own pool settings (zz-docker.conf).
[www]
; Keep the container's environment (APP_KEY, DB_URL…) visible to PHP.
clear_env = no
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
