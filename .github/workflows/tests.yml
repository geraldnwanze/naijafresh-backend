name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: naijafresh
          POSTGRES_PASSWORD: naijafresh
          POSTGRES_DB: naijafresh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naijafresh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, pdo_pgsql, pgsql, bcmath, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Security advisories
        run: composer audit

      - name: Code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test --compact
